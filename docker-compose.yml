name: star-api-platform

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
      API_SITE_ADDRESS: ${API_SITE_ADDRESS:?API_SITE_ADDRESS is required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - starapi-caddy-data:/data
      - starapi-caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    image: star-api-migrator:local
    restart: "no"
    environment:
      DATABASE_URL: postgresql://starapi:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/starapi?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        PRISMA_ENGINES_MIRROR: ${PRISMA_ENGINES_MIRROR:-}
    image: star-api-platform:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://starapi:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/starapi?schema=public
      REDIS_URL: redis://redis:6379
      API_KEY_PEPPER: ${API_KEY_PEPPER:?API_KEY_PEPPER is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      INSTALL_TOKEN: ${INSTALL_TOKEN:?INSTALL_TOKEN is required}
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:?INTERNAL_GATEWAY_SECRET is required}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      API_PUBLIC_HOST: ${API_PUBLIC_HOST:?API_PUBLIC_HOST is required}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL is required}
      LOCAL_UPSTREAM_HOSTS: ${LOCAL_UPSTREAM_HOSTS:-host.docker.internal}
      PHP_RUNNER_URL: http://php-runner:8080/execute
      PHP_RUNNER_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      php-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - frontend
      - backend
      - execution
    extra_hosts:
      - "host.docker.internal:host-gateway"

  php-runner:
    build:
      context: ./php-runner
      dockerfile: Dockerfile
      args:
        ALPINE_IMAGE: ${ALPINE_IMAGE:-m.daocloud.io/docker.io/library/alpine:3.20}
    image: star-api-php-runner:local
    restart: unless-stopped
    environment:
      RUNNER_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks:
      - execution

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: starapi
      POSTGRES_USER: starapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - starapi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starapi -d starapi"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - starapi-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true
  execution:
    internal: true

volumes:
  starapi-postgres:
  starapi-redis:
  starapi-caddy-data:
  starapi-caddy-config:
