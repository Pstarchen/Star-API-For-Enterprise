name: Release container images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.release.outputs.namespace }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        name: Resolve image namespace and version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${REQUESTED_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: ${version}" >&2
            exit 1
          fi
          echo "namespace=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.suffix }})
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: app
            image: star-api-app
            context: .
            file: Dockerfile
            target: runner
          - name: migrator
            image: star-api-migrator
            context: .
            file: Dockerfile
            target: migrator
          - name: php-runner
            image: star-api-php-runner
            context: ./php-runner
            file: ./php-runner/Dockerfile
            target: ""
        platform:
          - name: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - name: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.platform.name }}
          push: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.namespace }}/${{ matrix.image.image }}:${{ needs.prepare.outputs.version }}-${{ matrix.platform.suffix }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.suffix }}
          provenance: true
          sbom: true

  manifest:
    name: Publish ${{ matrix.name }} manifest
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: star-api-app
          - name: migrator
            image: star-api-migrator
          - name: php-runner
            image: star-api-php-runner
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge architecture images
        shell: bash
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.namespace }}/${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
