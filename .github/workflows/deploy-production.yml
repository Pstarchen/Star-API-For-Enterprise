name: Deploy production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without the v prefix
        required: true
        type: string
      confirmation:
        description: Type DEPLOY to start the production update
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: star-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy v${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    env:
      DEPLOY_VERSION: ${{ inputs.version }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
      SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
      SSH_USER: ${{ vars.PRODUCTION_SSH_USER || 'root' }}
      DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
      PUBLIC_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
      RELEASE_IMAGE_NAMESPACE: ghcr.io/pstarchen
      PRODUCTION_IMAGE_PROXIES: ${{ vars.PRODUCTION_IMAGE_PROXIES || 'ghcr.nju.edu.cn,ghcr.1ms.run,ghcr.chenby.cn' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must use stable X.Y.Z format." >&2
            exit 1
          }
          [[ "$DEPLOY_CONFIRMATION" == "DEPLOY" ]] || {
            echo "Production deployment confirmation must be DEPLOY." >&2
            exit 1
          }
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || {
            echo "PRODUCTION_SSH_PORT must be between 1 and 65535." >&2
            exit 1
          }
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || {
            echo "PRODUCTION_SSH_USER contains unsupported characters." >&2
            exit 1
          }
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != "/" ]] || {
            echo "PRODUCTION_DEPLOY_PATH must be an absolute non-root path." >&2
            exit 1
          }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || {
            echo "PRODUCTION_DEPLOY_PATH contains unsupported characters." >&2
            exit 1
          }
          [[ -z "$PUBLIC_HEALTH_URL" || "$PUBLIC_HEALTH_URL" =~ ^https?://[^[:space:]]+/api/health([/?#].*)?$ ]] || {
            echo "PRODUCTION_HEALTH_URL must be an HTTP(S) /api/health URL." >&2
            exit 1
          }
          [[ "$PRODUCTION_IMAGE_PROXIES" =~ ^[A-Za-z0-9.-]+(,[A-Za-z0-9.-]+)*$ ]] || {
            echo "PRODUCTION_IMAGE_PROXIES must be a comma-separated list of registry hosts." >&2
            exit 1
          }
          git rev-parse --verify "refs/tags/v${DEPLOY_VERSION}^{commit}" >/dev/null || {
            echo "Tag v${DEPLOY_VERSION} is not present in this checkout." >&2
            exit 1
          }

      - name: Configure verified SSH access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || {
            echo "Production SSH key or known-hosts secret is missing." >&2
            exit 1
          }
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/star-api-production"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/star-api-production"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P "" -f "$HOME/.ssh/star-api-production" >/dev/null || {
            echo "PRODUCTION_SSH_PRIVATE_KEY must be a valid unencrypted deployment key." >&2
            exit 1
          }

      - name: Build versioned deployment payload
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/star-api-deploy"
          install -m 600 compose.production.yml "$RUNNER_TEMP/star-api-deploy/compose.production.yml"
          install -m 700 scripts/update-production.sh "$RUNNER_TEMP/star-api-deploy/update-production.sh"
          install -m 700 scripts/production.sh "$RUNNER_TEMP/star-api-deploy/production.sh"
          install -m 700 scripts/process-local-update.sh "$RUNNER_TEMP/star-api-deploy/process-local-update.sh"
          tar -C "$RUNNER_TEMP/star-api-deploy" -czf "$RUNNER_TEMP/star-api-deploy.tar.gz" compose.production.yml update-production.sh production.sh process-local-update.sh

      - name: Inspect and update production
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_HOST" ]] || {
            echo "PRODUCTION_SSH_HOST is missing." >&2
            exit 1
          }
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || {
            echo "PRODUCTION_SSH_HOST contains unsupported characters." >&2
            exit 1
          }
          ssh_options=(
            -i "$HOME/.ssh/star-api-production"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
          )
          scp_options=(
            -i "$HOME/.ssh/star-api-production"
            -P "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
          )
          timeout 120 ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" bash -s -- "$DEPLOY_PATH" <<'REMOTE_PREP'
          set -Eeuo pipefail
          deploy_path="$1"
          [[ "$deploy_path" == /* && "$deploy_path" != "/" ]]
          find /tmp -maxdepth 1 \( -name 'star-api-deploy-*' -o -name 'star-api-deploy.*' \) -exec rm -rf -- {} + 2>/dev/null || true
          if [[ -d "$deploy_path/.deploy-tmp" ]]; then
            find "$deploy_path/.deploy-tmp" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true
          fi
          if [[ -d "$deploy_path/backups" ]]; then
            keep="${STAR_API_BACKUP_KEEP:-1}"
            find "$deploy_path/backups" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -nr \
              | awk -v keep="$keep" 'NR > keep { sub(/^[^ ]+ /, ""); print }' \
              | while IFS= read -r old_backup; do
                  [[ "$old_backup" == "$deploy_path/backups"/* ]] && rm -rf -- "$old_backup"
                done
          fi
          docker container prune --force >/dev/null 2>&1 || true
          docker builder prune --all --force >/dev/null 2>&1 || true
          docker image prune --all --force >/dev/null 2>&1 || true
          if [[ -d /var/lib/docker/containers ]]; then
            find /var/lib/docker/containers -type f -name '*-json.log' -exec sh -c ': > "$1"' sh {} \; 2>/dev/null || true
          fi
          journalctl --vacuum-size=100M >/dev/null 2>&1 || true
          install -d -m 700 "$deploy_path/.deploy-tmp"
          docker system df || true
          df -h "$deploy_path" /tmp || true
          REMOTE_PREP

          remote_arch="$(timeout 30 ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" uname -m | tr -d '\r\n')"
          case "$remote_arch" in
            x86_64|amd64) remote_platform="linux/amd64" ;;
            aarch64|arm64) remote_platform="linux/arm64" ;;
            *) echo "Unsupported production architecture: $remote_arch" >&2; exit 1 ;;
          esac
          release_images=(
            "$RELEASE_IMAGE_NAMESPACE/star-api-app:$DEPLOY_VERSION"
            "$RELEASE_IMAGE_NAMESPACE/star-api-migrator:$DEPLOY_VERSION"
            "$RELEASE_IMAGE_NAMESPACE/star-api-php-runner:$DEPLOY_VERSION"
          )
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          IFS=',' read -r -a image_proxies <<< "$PRODUCTION_IMAGE_PROXIES"
          remote_os="${remote_platform%/*}"
          remote_architecture="${remote_platform#*/}"
          for image in "${release_images[@]}"; do
            manifest="$(timeout 60 docker manifest inspect "$image")"
            official_digest="$(jq -er --arg os "$remote_os" --arg architecture "$remote_architecture" '.manifests[] | select(.platform.os == $os and .platform.architecture == $architecture) | .digest' <<< "$manifest" | head -n 1)"
            [[ "$official_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
              echo "Official image digest is unavailable for $image on $remote_platform." >&2
              exit 1
            }
            proxy_loaded=0
            for proxy in "${image_proxies[@]}"; do
              proxy_ref="${proxy}/${image#ghcr.io/}@${official_digest}"
              echo "Pulling $image through $proxy with official digest $official_digest"
              if timeout 20m ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" docker pull --platform "$remote_platform" "$proxy_ref"; then
                timeout 30 ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" docker tag "$proxy_ref" "$image"
                proxy_loaded=1
                break
              fi
            done
            [[ "$proxy_loaded" == "1" ]] || {
              echo "All production image proxies failed for $image." >&2
              exit 1
            }
          done

          remote_payload="$DEPLOY_PATH/.deploy-tmp/star-api-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          timeout 120 scp "${scp_options[@]}" "$RUNNER_TEMP/star-api-deploy.tar.gz" "$SSH_USER@$SSH_HOST:$remote_payload"
          timeout 120m ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" bash -s -- "$DEPLOY_VERSION" "$DEPLOY_PATH" "$remote_payload" "$PRODUCTION_IMAGE_PROXIES" <<'REMOTE'
          set -Eeuo pipefail

          version="$1"
          deploy_path="$2"
          payload_archive="$3"
          image_proxies="$4"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$deploy_path" == /* && "$deploy_path" != "/" ]]
          [[ "$payload_archive" == "$deploy_path/.deploy-tmp"/star-api-deploy-*.tar.gz ]]
          [[ "$image_proxies" =~ ^[A-Za-z0-9.-]+(,[A-Za-z0-9.-]+)*$ ]]
          cd -- "$deploy_path"
          test -f .env.production
          test -f compose.production.yml

          install -d -m 700 "$deploy_path/.deploy-tmp"
          payload_dir="$(mktemp -d "$deploy_path/.deploy-tmp/payload.XXXXXXXX")"
          cleanup() { rm -rf -- "$payload_dir" "$payload_archive"; }
          trap cleanup EXIT
          tar -xzf "$payload_archive" -C "$payload_dir" --no-same-owner --no-same-permissions
          test -f "$payload_dir/compose.production.yml"
          test -f "$payload_dir/update-production.sh"
          test -f "$payload_dir/production.sh"
          test -f "$payload_dir/process-local-update.sh"
          chmod 700 "$payload_dir/update-production.sh"
          chmod 700 "$payload_dir/production.sh"
          chmod 700 "$payload_dir/process-local-update.sh"

          STAR_API_PROJECT_DIR="$deploy_path" \
          STAR_API_NEXT_COMPOSE_FILE="$payload_dir/compose.production.yml" \
          STAR_API_BACKUP_KEEP=1 \
            bash "$payload_dir/update-production.sh" --check "$version" </dev/null
          STAR_API_PROJECT_DIR="$deploy_path" \
          STAR_API_NEXT_COMPOSE_FILE="$payload_dir/compose.production.yml" \
          STAR_API_BACKUP_KEEP=1 \
            bash "$payload_dir/update-production.sh" "$version" </dev/null
          install -d -m 755 "$deploy_path/scripts"
          install -m 700 "$payload_dir/update-production.sh" "$deploy_path/scripts/update-production.sh"
          install -m 700 "$payload_dir/production.sh" "$deploy_path/scripts/production.sh"
          install -m 700 "$payload_dir/process-local-update.sh" "$deploy_path/scripts/process-local-update.sh"
          STAR_API_PROJECT_DIR="$deploy_path" \
          STAR_API_DEFAULT_IMAGE_PROXIES="$image_proxies" \
            bash "$payload_dir/production.sh" enable-updates

          compose=(docker compose --env-file .env.production -f compose.production.yml)
          for service in postgres redis app php-runner; do
            healthy=0
            for _ in $(seq 1 24); do
              container_id="$("${compose[@]}" ps --quiet "$service")"
              if [[ -n "$container_id" && "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")" == "healthy" ]]; then
                healthy=1
                break
              fi
              sleep 5
            done
            [[ "$healthy" == "1" ]] || {
              echo "Required service did not become healthy: $service" >&2
              "${compose[@]}" ps >&2
              exit 1
            }
          done
          app_port="$(sed -n 's/^APP_PORT=//p' .env.production | tail -n 1 | tr -d '\r')"
          app_port="${app_port:-18081}"
          curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:${app_port}/api/health"
          REMOTE

      - name: Verify public health endpoint
        if: ${{ vars.PRODUCTION_HEALTH_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --max-time 15 "$PUBLIC_HEALTH_URL")"
          grep -Eq '"version"[[:space:]]*:[[:space:]]*"'"$DEPLOY_VERSION"'"' <<<"$health"
          grep -Eq '"database"[[:space:]]*:[[:space:]]*"connected"' <<<"$health"
          printf '%s\n' "$health"

      - name: Remove temporary SSH key
        if: ${{ always() }}
        shell: bash
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -rf "$HOME/.ssh/star-api-production" "$RUNNER_TEMP/star-api-deploy" "$RUNNER_TEMP/star-api-deploy.tar.gz"
