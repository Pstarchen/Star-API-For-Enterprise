name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://starapi:ci-only@localhost:5432/starapi?schema=public

jobs:
  quality:
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:production-updater
      - run: npm run test:workflows
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  container:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: star-api-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
