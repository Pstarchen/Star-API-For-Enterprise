name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://starapi:ci-only@localhost:5432/starapi?schema=public

jobs:
  quality:
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:image-signature
      - run: npm run test:php-package
      - run: npm run test:upstream
      - run: npm run test:epay
      - run: npm run test:production-updater
      - run: npm run test:workflows
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  container:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: app
            context: .
            file: Dockerfile
            tag: star-api-platform:ci
          - name: php-runner
            context: ./php-runner
            file: ./php-runner/Dockerfile
            tag: star-api-php-runner:ci
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
